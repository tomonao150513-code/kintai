{% load kintai_extras %}
{% if running %}
  <div class="card border-success mb-4" id="running-timer"
       data-elapsed="{{ running_elapsed_seconds }}">
    <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div>
        <span class="badge text-bg-success">計測中</span>
        <span class="ms-2 fw-semibold">
          {{ running.task.project.name }} / {{ running.task.name }}
        </span>
        <div class="text-body-secondary small">開始 {{ running.start_at|date:"H:i:s" }}</div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="fs-4 fw-bold font-monospace" id="running-elapsed">
          {{ running_elapsed_seconds|hms }}
        </span>
        <form method="post" action="{% url 'timer_stop' %}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-success">終了</button>
        </form>
      </div>
    </div>
  </div>
{% endif %}
