<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | タスク別勤怠</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container" style="max-width: 420px;">
    <div class="card mt-5 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">タスク別勤怠</h1>

        {% if form.non_field_errors %}
          <div class="alert alert-danger">
            {% for error in form.non_field_errors %}{{ error }}{% endfor %}
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label">ユーザー名</label>
            <input type="text" name="{{ form.username.name }}"
                   id="{{ form.username.id_for_label }}"
                   class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label for="{{ form.password.id_for_label }}" class="form-label">パスワード</label>
            <input type="password" name="{{ form.password.name }}"
                   id="{{ form.password.id_for_label }}"
                   class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">ログイン</button>
          <input type="hidden" name="next" value="{{ next }}">
        </form>
      </div>
    </div>
  </main>
</body>
</html>
